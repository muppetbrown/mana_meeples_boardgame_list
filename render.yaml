services:
  - type: web
    name: mana-meeples-boardgame-list
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Only values that differ from the defaults in backend/config.py are set here.
      # See .env.example for the full list of tunables (pool sizes, timeouts, cache, ...).
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_BASE_URL
        value: https://mana-meeples-boardgame-list-opgf.onrender.com
      - key: CORS_ORIGINS
        value: https://manaandmeeples.co.nz,https://www.manaandmeeples.co.nz,https://library.manaandmeeples.co.nz,https://mana-meeples-library-web.onrender.com
      # Secrets - set in the Render dashboard (never committed)
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SESSION_SECRET   # signs admin JWTs; REQUIRED in production (app refuses to start without it)
        sync: false
      - key: BGG_API_KEY
        sync: false
      - key: GITHUB_TOKEN     # triggers/polls the sleeve-fetch workflow
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
    disk:
      name: thumbs-storage
      mountPath: /var/data
      sizeGB: 1

  - type: redis
    name: boardgame-library-redis
    plan: free
    maxmemoryPolicy: volatile-lru  # Only evict keys with TTL (protects sessions)
    ipAllowList: []  # empty = allow all Render services

  - type: web
    name: mana-meeples-library-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: VITE_API_BASE
        value: https://mana-meeples-boardgame-list-opgf.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
