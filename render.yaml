services:
  - type: web
    name: mana-meeples-boardgame-list
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Only values that differ from the defaults in backend/config.py are set here.
      # See .env.example for the full list of tunables (pool sizes, timeouts, cache, ...).
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_BASE_URL
        value: https://mana-meeples-boardgame-list-opgf.onrender.com
      - key: CORS_ORIGINS
        value: https://manaandmeeples.co.nz,https://www.manaandmeeples.co.nz,https://library.manaandmeeples.co.nz,https://mana-meeples-library-web.onrender.com
      # Proxies in front of the app that append to X-Forwarded-For. The deploy log prints the
      # real entry count on the first request ("X-Forwarded-For arrived with N entries"); raise this if
      # the chain is longer than expected, or users will share one rate-limit bucket.
      # Confirmed via Render logs (2026-10-14/15): requests through the public URL consistently
      # arrive with 2 entries, so Render fronts the app with 2 proxy hops.
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      # Secrets - set in the Render dashboard (never committed)
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SESSION_SECRET   # signs admin JWTs; REQUIRED in production (app refuses to start without it)
        sync: false
      - key: BGG_API_KEY
        sync: false
      - key: GITHUB_TOKEN     # triggers/polls the sleeve-fetch workflow
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
    # No persistent disk: images are served via Cloudinary (see CLAUDE.md), nothing writes to
    # local disk anymore. A disk forces Render to stop the old instance and detach the disk
    # before it can start the new one (no zero-downtime deploy), and with nothing freeing the
    # old instance, that step can hang indefinitely with no error in the logs. See
    # docs/operations/STUCK_DEPLOY.md.

  - type: redis
    name: boardgame-library-redis
    plan: free
    maxmemoryPolicy: volatile-lru  # Only evict keys with TTL (protects sessions)
    ipAllowList: []  # empty = allow all Render services

  - type: web
    name: mana-meeples-library-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      # jsdom 30 (dev dependency) needs Node >= 22.22.2; "22" resolves to the latest 22.x
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE
        value: https://mana-meeples-boardgame-list-opgf.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
